services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - rag_data:/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # baked into the browser bundle – must be reachable from the user's browser
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  rag_data:
